# Foundry clock. Does NOT open pull requests.
# Default is dry: parses allowlist.yaml and asserts denylist disjointness.
# Set repository variable FOUNDRY_LIVE=true to file a packet issue for humans.

name: oss-tick

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Pinned for the reason given in ci.yml, and it matters more here: this job carries
      # `issues: write` and a GITHUB_TOKEN, and runs unattended with nobody reading the output.
      # Hardening the read-only gate and leaving the token-bearing clock on a moving tag would be
      # theatre. Same commits `v4`/`v7` already resolved to — no behaviour change.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate allowlist
        run: node --experimental-strip-types factory/validate-allowlist.ts
      - name: Verify committed ledger against GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types factory/verify-ledger.ts
      - name: Dry notice
        if: ${{ vars.FOUNDRY_LIVE != 'true' }}
        run: echo "FOUNDRY_LIVE is not set — clock stays dry. No issues, no PRs."
      - name: Open packet issue
        if: ${{ vars.FOUNDRY_LIVE == 'true' }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = "tick: next packet (human freeze required)";
            const body = [
              "The 6h clock fired.",
              "",
              "This issue is a **packet request**, not a contribution.",
              "Open Foundry, run `node --experimental-strip-types factory/cli.ts tick`, freeze the packet, then hand it to `oss-contribute`.",
              "",
              "Do not open a PR from this workflow.",
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "packet",
              per_page: 5,
            });
            if (open.data.length) {
              console.log("packet already open", open.data[0].html_url);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["packet"],
            });
